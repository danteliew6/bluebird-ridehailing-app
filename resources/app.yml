resources:
  apps:
    bluebird_ops:
      name: bluebird-ops
      description: "Bluebird ride-hailing operations — whitelabeled AppKit control center"
      # Deploy from the bundle-synced workspace files (no external git dependency).
      # The bundle root (one level up from resources/) is the app source directory.
      source_code_path: ../
      user_api_scopes:
        - dashboards.genie
        - serving.serving-endpoints
      # Resources the app binds to, parameterized off the bundle variables so the
      # same app deploys against any workspace/target.
      resources:
        - name: sql-warehouse
          sql_warehouse:
            id: ${var.warehouse_id}
            permission: CAN_USE
        - name: genie-space
          genie_space:
            name: ${var.genie_space_name}
            # Bind to the DAB-managed Genie space (created by resources/genie.yml),
            # so replication is fully self-contained — no manual import/id wiring.
            space_id: ${resources.genie_spaces.bluebird_genie.id}
            permission: CAN_RUN
        - name: serving-endpoint
          serving_endpoint:
            name: ${var.serving_endpoint_name}
            permission: CAN_QUERY
        - name: postgres
          postgres:
            branch: ${var.lakebase_branch}
            database: ${var.lakebase_database}
            permission: CAN_CONNECT_AND_CREATE
